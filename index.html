<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I am Sorry ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ff758c, #ff7eb3, #ff6a88, #ff99ac);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            max-width: 500px;
            width: 90%;
            animation: floatIn 0.8s ease-out;
            position: relative;
            z-index: 10;
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #mainText {
            font-size: 2em;
            color: #d81b60;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.4;
        }

        #subText {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            position: relative;
        }

        button {
            font-family: inherit;
            font-size: 1.2em;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        #yesBtn {
            background: #d81b60;
            color: white;
            position: relative;
            z-index: 5;
        }

        #yesBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.4);
            background: #c2185b;
        }

        #noBtn {
            background: #f8bbd0;
            color: #d81b60;
            position: absolute;
            z-index: 10;
        }

        .hidden { display: none !important; }

        .heart {
            position: fixed;
            font-size: 2em;
            animation: floatUp 4s ease-in-out;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-800px) scale(1.5); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="mainText">I am really sorry. 🥺</div>
        <div id="subText">Mujhe maaf kar do, I mean it. ❤️</div>
        
        <div class="buttons">
            <button id="yesBtn">Maaf kiya ❤️</button>
            <button id="noBtn">Nahi</button>
        </div>
    </div>

    <script>
        const mainText = document.getElementById('mainText');
        const subText = document.getElementById('subText');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const buttonsContainer = document.querySelector('.buttons');
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        const apologies = [
            "Please? 🥺",
            "Maan jao na please...",
            "Sach mein sorry...",
            "I promise, aage se nahi hoga.",
            "Please forgive me ❤️"
        ];
        let apologyIndex = 0;

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '❤️';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = window.innerHeight + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function moveNoButton() {
            const rect = buttonsContainer.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            const yesRect = yesBtn.getBoundingClientRect();
            const maxX = rect.width - btnRect.width;
            const maxY = rect.height - btnRect.height;
            
            let newX, newY;
            let attempts = 0;
            
            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
                attempts++;
                
                const noLeft = rect.left + newX;
                const noRight = noLeft + btnRect.width;
                const noTop = rect.top + newY;
                const noBottom = noTop + btnRect.height;
                
                const padding = 20;
                const overlaps = !(
                    noRight + padding < yesRect.left ||
                    noLeft - padding > yesRect.right ||
                    noBottom + padding < yesRect.top ||
                    noTop - padding > yesRect.bottom
                );
                
                if (!overlaps || attempts >= 50) break;
            } while (true);
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        function initNoButton() {
            noBtn.style.left = isMobile ? '65%' : '60%';
            noBtn.style.top = '50%';
            noBtn.style.transform = 'translate(-50%, -50%)';
        }

        function handleNoAction() {
            moveNoButton();
            subText.innerHTML = apologies[apologyIndex % apologies.length];
            apologyIndex++;
        }

        initNoButton();
        window.addEventListener('resize', initNoButton);

        // Desktop
        if (!isMobile) {
            noBtn.addEventListener('mouseenter', handleNoAction);
        }

        // Mobile
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            handleNoAction();
        });

        // Yes Button
        yesBtn.addEventListener('click', function() {
            mainText.innerHTML = "Thank You! ❤️";
            subText.innerHTML = "I love you so much.";
            buttonsContainer.classList.add('hidden');

            for (let i = 0; i < 30; i++) {
                setTimeout(() => createHeart(), i * 150);
            }
        });
    </script>
</body>
</html>
